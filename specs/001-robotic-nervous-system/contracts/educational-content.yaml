# API Contracts: Educational Content Delivery for Robotic Nervous System

## Overview

These contracts define the structure and organization of educational content for Module 1: The Robotic Nervous System. Rather than traditional API endpoints, these contracts specify how educational materials will be organized, categorized, and connected to ensure a coherent learning experience.

## Content Organization Contract

### Base Content Structure
```
GET /module-1-robotic-nervous-system/{section}/{topic}
```

**Purpose**: Define the hierarchical organization of educational content

**Response Structure**:
```json
{
  "moduleId": "001-robotic-nervous-system",
  "moduleName": "The Robotic Nervous System",
  "section": "{introduction|communication-concepts|practical-applications}",
  "topic": "{specific-topic-name}",
  "title": "Descriptive title for the content",
  "learningObjectives": ["objective1", "objective2"],
  "content": "Main educational content in MDX format",
  "analogiesUsed": ["analogy1", "analogy2"],
  "visualElements": ["diagram1", "animation1"],
  "previousTopic": "URL to previous topic",
  "nextTopic": "URL to next topic",
  "relatedTopics": ["URL1", "URL2"],
  "exercises": ["exercise1", "exercise2"],
  "estimatedReadingTime": "minutes"
}
```

## Educational Content Types

### 1. Concept Introduction Contract
```
POST /concepts/introduce
```

**Purpose**: Standardized format for introducing new concepts using analogies

**Request Body**:
```json
{
  "conceptName": "string",
  "realWorldAnalogy": {
    "domain": "human_body|company|city|etc",
    "comparison": "detailed comparison explanation",
    "validityRange": "situations where analogy holds true"
  },
  "technicalCounterpart": "actual robotics concept",
  "keyCharacteristics": ["characteristic1", "characteristic2"],
  "commonMisconceptions": ["misconception1", "misconception2"]
}
```

**Response**: Formatted educational content with analogy prominently featured

### 2. Visualization Request Contract
```
GET /visualizations/{type}/{concept}
```

**Purpose**: Retrieve appropriate visual aids for different concepts

**Supported Types**:
- `flow-diagram`: Shows information flow between components
- `analogy-illustration`: Visual representation of real-world analogies
- `component-map`: Shows how robot parts connect
- `interaction-pattern`: Demonstrates communication patterns

**Response**:
```json
{
  "visualizationId": "unique-id",
  "type": "flow-diagram|analogy-illustration|component-map|interaction-pattern",
  "concept": "related concept name",
  "svgContent": "SVG markup or URL to asset",
  "interactiveElements": ["element1", "element2"],
  "labels": {"element1": "description"},
  "explanation": "Text explanation of the visualization"
}
```

## Learning Path Contract

### Sequential Learning Path
```
GET /learning-path/{starting-point}/sequence
```

**Purpose**: Define the recommended sequence of topics for optimal learning

**Response**:
```json
{
  "pathId": "foundational-to-advanced",
  "title": "Recommended Learning Sequence",
  "steps": [
    {
      "order": 1,
      "topicId": "basic-concepts",
      "prerequisites": [],
      "learningGoals": ["understand basic terminology"],
      "estimatedTime": "15 minutes"
    },
    {
      "order": 2,
      "topicId": "communication-analogies",
      "prerequisites": ["basic-concepts"],
      "learningGoals": ["understand communication patterns"],
      "estimatedTime": "25 minutes"
    }
  ],
  "completionCriteria": {
    "understandingThreshold": 0.8,
    "assessmentScore": 0.75
  }
}
```

## Assessment Integration Contract

### Comprehension Check
```
POST /assessments/comprehension
```

**Purpose**: Submit answers to comprehension questions and receive feedback

**Request Body**:
```json
{
  "userId": "anonymous or authenticated user",
  "topicId": "current topic being assessed",
  "answers": [
    {
      "questionId": "unique-question-identifier",
      "selectedOption": "option-id or free-form text",
      "confidenceLevel": 1-5 scale
    }
  ],
  "timeTaken": "seconds to complete"
}
```

**Response**:
```json
{
  "assessmentId": "unique-assessment-id",
  "results": {
    "overallScore": 0.0-1.0,
    "breakdown": {
      "conceptualUnderstanding": 0.0-1.0,
      "analogyApplication": 0.0-1.0,
      "practicalConnection": 0.0-1.0
    },
    "recommendations": [
      {
        "action": "review-topic|continue-learning|practice-more",
        "topicId": "recommended-topic",
        "reason": "explanation of recommendation"
      }
    ],
    "misconceptionsDetected": ["concept1", "concept2"]
  }
}
```

## Interactive Exercise Contract

### Scenario-Based Exercise
```
POST /exercises/scenario
```

**Purpose**: Engage students with scenario-based learning exercises

**Request Body**:
```json
{
  "scenarioId": "unique-scenario-identifier",
  "studentInput": "student's response or decision",
  "context": {
    "robotConfiguration": "description of robot setup",
    "environmentalFactors": ["factor1", "factor2"],
    "desiredOutcome": "what robot should accomplish"
  }
}
```

**Response**:
```json
{
  "exerciseId": "unique-exercise-id",
  "evaluation": {
    "accuracy": 0.0-1.0,
    "reasoningQuality": "high|medium|low",
    "appliedConcepts": ["concept1", "concept2"],
    "feedback": "constructive feedback for the student"
  },
  "learningPoints": [
    {
      "concept": "related concept",
      "explanation": "why this matters",
      "connection": "how it relates to other concepts"
    }
  ]
}
```

## Content Retrieval Contracts

### Related Content Discovery
```
GET /content/related/{current-topic-id}
```

**Purpose**: Find related educational content to deepen understanding

**Query Parameters**:
- `depth`: How many levels of related content to return
- `type`: Filter by content type (concept, exercise, visualization)
- `difficulty`: Filter by difficulty level

**Response**:
```json
{
  "topicId": "current-topic",
  "relatedContent": [
    {
      "relatedTopicId": "related-topic-id",
      "relationshipType": "prerequisite|extension|alternative-perspective|application",
      "relevanceScore": 0.0-1.0,
      "title": "Related content title",
      "summary": "Brief description",
      "estimatedTime": "time to consume",
      "accessibilityFeatures": ["feature1", "feature2"]
    }
  ]
}
```

### Concept Search
```
GET /concepts/search
```

**Purpose**: Search for concepts by keyword, analogy, or application

**Query Parameters**:
- `q`: Search query
- `byAnalogy`: Whether to search in analogies as well as technical content
- `complexityMin`: Minimum complexity level
- `complexityMax`: Maximum complexity level

**Response**:
```json
{
  "searchQuery": "original query",
  "results": [
    {
      "conceptId": "unique-concept-id",
      "title": "Concept title",
      "matchingExcerpt": "Relevant excerpt from content",
      "primaryAnalogy": "Main real-world comparison",
      "relatedSections": ["section1", "section2"],
      "matchConfidence": 0.0-1.0
    }
  ]
}
```

