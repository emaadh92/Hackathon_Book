## Content Customization Contract

### Adaptive Content Delivery
```
POST /content/adapt
```

**Purpose**: Customize content delivery based on learning style and progress

**Request Body**:
```json
{
  "userId": "user identifier",
  "preferences": {
    "learningStyle": "visual|auditory|kinesthetic|reading-writing",
    "pace": "slow|moderate|fast",
    "detailPreference": "overview|balanced|comprehensive",
    "analogyPreference": "simple|moderate|technical"
  },
  "progressData": {
    "recentTopics": ["topic1", "topic2"],
    "assessmentHistory": [{"topic": "x", "score": 0.8}],
    "timeSpentPerTopic": {"topic1": 15, "topic2": 25}
  },
  "currentTopic": "topic currently being studied"
}
```

**Response**:
```json
{
  "adaptedContent": {
    "presentationStyle": "adjusted for user preferences",
    "contentDepth": "adjusted level of detail",
    "analogyComplexity": "simple|moderate|detailed",
    "visualEmphasis": "high|medium|low",
    "interactiveElements": ["element1", "element2"]
  },
  "suggestedAdjustments": [
    {
      "aspect": "learning pace",
      "suggestion": "slow down for better retention",
      "evidence": "assessment data indicates gaps"
    }
  ]
}
```

## Error Handling Standards

All API contracts should follow these error response patterns:

```json
{
  "error": {
    "code": "ERROR_TYPE",
    "message": "Human-readable error message",
    "details": "Additional context about the error",
    "suggestion": "How to resolve the issue"
  }
}
```

Common error codes:
- `CONTENT_NOT_FOUND`: Requested educational content does not exist
- `PREREQUISITE_MISSING`: User needs to complete prerequisite material
- `ASSESSMENT_LOCKED`: Cannot submit assessment without completing learning material
- `INVALID_INPUT`: Provided data does not match expected format
- `RATE_LIMITED`: Too many requests within time window