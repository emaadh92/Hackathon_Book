<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#212529">NVIDIA Isaac Sim Architecture</text>

  <!-- Omniverse Platform Box -->
  <rect x="50" y="80" width="700" height="100" fill="#e9ecef" stroke="#495057" stroke-width="2" rx="10"/>
  <text x="400" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#212529">NVIDIA Omniverse Platform</text>
  <text x="400" y="140" text-anchor="middle" font-size="14" fill="#495057">Foundation for Real-time Collaboration & Simulation</text>

  <!-- Isaac Sim Layer -->
  <rect x="100" y="220" width="600" height="120" fill="#dce2e8" stroke="#0d6efd" stroke-width="2" rx="10"/>
  <text x="400" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#212529">Isaac Sim</text>

  <!-- Sub-components of Isaac Sim -->
  <rect x="130" y="280" width="160" height="40" fill="#cce6ff" stroke="#0d6efd" stroke-width="1" rx="5"/>
  <text x="210" y="305" text-anchor="middle" font-size="12" fill="#212529">Physics Engine</text>

  <rect x="320" y="280" width="160" height="40" fill="#cce6ff" stroke="#0d6efd" stroke-width="1" rx="5"/>
  <text x="400" y="305" text-anchor="middle" font-size="12" fill="#212529">Rendering System</text>

  <rect x="510" y="280" width="160" height="40" fill="#cce6ff" stroke="#0d6efd" stroke-width="1" rx="5"/>
  <text x="590" y="305" text-anchor="middle" font-size="12" fill="#212529">Sensor Simulation</text>

  <!-- Robot Assets Box -->
  <rect x="150" y="380" width="200" height="80" fill="#d1e7dd" stroke="#198754" stroke-width="2" rx="10"/>
  <text x="250" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#212529">Robot Assets</text>
  <text x="250" y="435" text-anchor="middle" font-size="12" fill="#495057">URDF/SDF Models</text>

  <!-- Environment Assets Box -->
  <rect x="450" y="380" width="200" height="80" fill="#d1e7dd" stroke="#198754" stroke-width="2" rx="10"/>
  <text x="550" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#212529">Environment Assets</text>
  <text x="550" y="435" text-anchor="middle" font-size="12" fill="#495057">3D Scenes & Objects</text>

  <!-- AI Training Box -->
  <rect x="300" y="500" width="200" height="60" fill="#f8d7da" stroke="#dc3545" stroke-width="2" rx="10"/>
  <text x="400" y="525" text-anchor="middle" font-size="14" font-weight="bold" fill="#212529">AI Training</text>
  <text x="400" y="545" text-anchor="middle" font-size="12" fill="#495057">Synthetic Data Generation</text>

  <!-- Arrows showing relationships -->
  <line x1="210" y1="320" x2="250" y2="380" stroke="#6c757d" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="320" x2="450" y2="380" stroke="#6c757d" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="320" x2="550" y2="380" stroke="#6c757d" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="250" y1="460" x2="400" y2="500" stroke="#6c757d" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="460" x2="400" y2="500" stroke="#6c757d" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d"/>
    </marker>
  </defs>
</svg>