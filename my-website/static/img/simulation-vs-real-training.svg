<svg width="900" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#212529">Simulation vs. Real-World Training Comparison</text>

  <!-- Left Column: Real-World Training -->
  <rect x="50" y="80" width="350" height="380" fill="#fff" stroke="#28a745" stroke-width="3" rx="15"/>
  <text x="225" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#28a745">Real-World Training</text>

  <!-- Real-world risks and costs -->
  <circle cx="90" cy="150" r="8" fill="#dc3545"/>
  <text x="110" y="155" font-size="14" fill="#212529">Physical damage risk</text>

  <circle cx="90" cy="180" r="8" fill="#ffc107"/>
  <text x="110" y="185" font-size="14" fill="#212529">High cost</text>

  <circle cx="90" cy="210" r="8" fill="#ffc107"/>
  <text x="110" y="215" font-size="14" fill="#212529">Slow data collection</text>

  <circle cx="90" cy="240" r="8" fill="#dc3545"/>
  <text x="110" y="245" font-size="14" fill="#212529">Safety concerns</text>

  <circle cx="90" cy="270" r="8" fill="#6c757d"/>
  <text x="110" y="275" font-size="14" fill="#212529">Limited scenarios</text>

  <!-- Real-world image representation -->
  <rect x="250" y="150" width="130" height="100" fill="#e9ecef" stroke="#6c757d" stroke-width="1" rx="5"/>
  <text x="315" y="200" text-anchor="middle" font-size="12" fill="#495057">Real</text>
  <text x="315" y="215" text-anchor="middle" font-size="12" fill="#495057">Robot</text>

  <!-- Right Column: Simulation Training -->
  <rect x="475" y="80" width="350" height="380" fill="#fff" stroke="#0d6efd" stroke-width="3" rx="15"/>
  <text x="650" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d6efd">Simulation Training</text>

  <!-- Simulation benefits -->
  <circle cx="515" cy="150" r="8" fill="#28a745"/>
  <text x="535" y="155" font-size="14" fill="#212529">No physical risk</text>

  <circle cx="515" cy="180" r="8" fill="#28a745"/>
  <text x="535" y="185" font-size="14" fill="#212529">Low cost</text>

  <circle cx="515" cy="210" r="8" fill="#28a745"/>
  <text x="535" y="215" font-size="14" fill="#212529">Fast data generation</text>

  <circle cx="515" cy="240" r="8" fill="#28a745"/>
  <text x="535" y="245" font-size="14" fill="#212529">Safe experimentation</text>

  <circle cx="515" cy="270" r="8" fill="#28a745"/>
  <text x="535" y="275" font-size="14" fill="#212529">Unlimited scenarios</text>

  <circle cx="515" cy="300" r="8" fill="#28a745"/>
  <text x="535" y="305" font-size="14" fill="#212529">Perfect ground truth</text>

  <!-- Simulation image representation -->
  <rect x="675" y="150" width="130" height="100" fill="#e9ecef" stroke="#6c757d" stroke-width="1" rx="5"/>
  <text x="740" y="200" text-anchor="middle" font-size="12" fill="#495057">Virtual</text>
  <text x="740" y="215" text-anchor="middle" font-size="12" fill="#495057">Robot</text>

  <!-- Bidirectional arrow between columns -->
  <line x1="425" y1="200" x2="475" y2="200" stroke="#6c757d" stroke-width="2" marker-start="url(#arrowhead-reverse)" marker-end="url(#arrowhead)"/>
  <text x="450" y="190" text-anchor="middle" font-size="14" fill="#212529">Transfer</text>
  <text x="450" y="210" text-anchor="middle" font-size="14" fill="#212529">Learning</text>

  <!-- Legend -->
  <rect x="50" y="470" width="20" height="20" fill="#28a745"/>
  <text x="75" y="485" font-size="12" fill="#212529">Benefit</text>

  <rect x="150" y="470" width="20" height="20" fill="#dc3545"/>
  <text x="175" y="485" font-size="12" fill="#212529">Risk/Challenge</text>

  <rect x="275" y="470" width="20" height="20" fill="#ffc107"/>
  <text x="300" y="485" font-size="12" fill="#212529">Moderate Issue</text>

  <!-- Arrowhead definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d"/>
    </marker>
    <marker id="arrowhead-reverse" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#6c757d"/>
    </marker>
  </defs>
</svg>