<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#212529">Obstacle Avoidance Process</text>

  <!-- Environment -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="400" height="400" fill="#e9f7ef" stroke="#20c997" stroke-width="2"/>
    <text x="200" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#20c997">Environment</text>

    <!-- Room structure -->
    <rect x="20" y="20" width="360" height="360" fill="#dee2e6" stroke="#adb5bd" stroke-width="2"/>

    <!-- Obstacles -->
    <rect x="100" y="100" width="80" height="40" fill="#6c757d" stroke="#495057" stroke-width="1"/>
    <rect x="250" y="150" width="60" height="80" fill="#6c757d" stroke="#495057" stroke-width="1"/>
    <circle cx="180" cy="250" r="25" fill="#6c757d" stroke="#495057" stroke-width="1"/>
    <rect x="80" y="300" width="100" height="30" fill="#6c757d" stroke="#495057" stroke-width="1"/>
    <circle cx="320" cy="280" r="20" fill="#6c757d" stroke="#495057" stroke-width="1"/>

    <!-- Robot start position -->
    <circle cx="50" cy="50" r="15" fill="#0d6efd" stroke="#0b5a9d" stroke-width="2"/>
    <text x="50" y="70" text-anchor="middle" font-size="10" fill="#495057">Start</text>

    <!-- Robot end position -->
    <circle cx="350" cy="350" r="15" fill="#28a745" stroke="#218838" stroke-width="2"/>
    <text x="350" y="370" text-anchor="middle" font-size="10" fill="#495057">Goal</text>

    <!-- Planned path -->
    <path d="M50,50 C100,100 150,150 200,200 C250,250 300,300 350,350"
          fill="none" stroke="#6f42c1" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="200" y="180" text-anchor="middle" font-size="10" fill="#6f42c1">Planned Path</text>

    <!-- Actual path with obstacle avoidance -->
    <path d="M50,50 C100,80 120,100 150,120 C180,140 220,160 250,180 C280,200 300,250 320,280 C340,300 350,320 350,350"
          fill="none" stroke="#dc3545" stroke-width="3"/>
    <text x="270" y="160" text-anchor="middle" font-size="10" fill="#dc3545">Actual Path</text>
  </g>

  <!-- Nav2 Obstacle Avoidance Components -->
  <g transform="translate(500, 80)">
    <rect x="0" y="0" width="400" height="400" fill="#fff" stroke="#0d6efd" stroke-width="2"/>
    <text x="200" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d6efd">Nav2 Obstacle Avoidance</text>

    <!-- Sensor Input -->
    <rect x="50" y="50" width="300" height="40" fill="#d1ecf1" stroke="#0c5460" stroke-width="1" rx="5"/>
    <text x="200" y="75" text-anchor="middle" font-size="12" fill="#0c5460">Sensor Input (LiDAR, Cameras, etc.)</text>

    <!-- Costmap -->
    <rect x="50" y="110" width="300" height="40" fill="#f8d7da" stroke="#721c24" stroke-width="1" rx="5"/>
    <text x="200" y="135" text-anchor="middle" font-size="12" fill="#721c24">Costmap Generation</text>

    <!-- Local Planner -->
    <rect x="50" y="170" width="300" height="40" fill="#d4edda" stroke="#155724" stroke-width="1" rx="5"/>
    <text x="200" y="195" text-anchor="middle" font-size="12" fill="#155724">Local Path Planning</text>

    <!-- Controller -->
    <rect x="50" y="230" width="300" height="40" fill="#e2e3e5" stroke="#41464b" stroke-width="1" rx="5"/>
    <text x="200" y="255" text-anchor="middle" font-size="12" fill="#41464b">Velocity Controller</text>

    <!-- Recovery Behaviors -->
    <rect x="50" y="290" width="300" height="40" fill="#f8d7da" stroke="#721c24" stroke-width="1" rx="5"/>
    <text x="200" y="315" text-anchor="middle" font-size="12" fill="#721c24">Recovery Behaviors</text>

    <!-- Feedback Loop -->
    <path d="M200,330 C200,360 150,360 150,330 C150,300 200,300 200,330"
          fill="none" stroke="#6c757d" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="120" y="340" text-anchor="middle" font-size="10" fill="#6c757d">Feedback</text>
  </g>

  <!-- Obstacle Avoidance Strategies -->
  <g transform="translate(50, 500)">
    <rect x="0" y="0" width="850" height="80" fill="#e2e3e5" stroke="#41464b" stroke-width="2" rx="8"/>
    <text x="425" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#41464b">Obstacle Avoidance Strategies</text>

    <!-- Dynamic Window Approach -->
    <rect x="20" y="35" width="180" height="30" fill="#d1ecf1" stroke="#0c5460" stroke-width="1" rx="5"/>
    <text x="110" y="55" text-anchor="middle" font-size="10" fill="#0c5460">Dynamic Window Approach</text>

    <!-- Vector Field Histogram -->
    <rect x="210" y="35" width="180" height="30" fill="#d1ecf1" stroke="#0c5460" stroke-width="1" rx="5"/>
    <text x="300" y="55" text-anchor="middle" font-size="10" fill="#0c5460">Vector Field Histogram</text>

    <!-- Potential Fields -->
    <rect x="400" y="35" width="180" height="30" fill="#d1ecf1" stroke="#0c5460" stroke-width="1" rx="5"/>
    <text x="490" y="55" text-anchor="middle" font-size="10" fill="#0c5460">Potential Fields</text>

    <!-- Trajectory Rollout -->
    <rect x="590" y="35" width="180" height="30" fill="#d1ecf1" stroke="#0c5460" stroke-width="1" rx="5"/>
    <text x="680" y="55" text-anchor="middle" font-size="10" fill="#0c5460">Trajectory Rollout</text>
  </g>

  <!-- Isaac ROS Integration -->
  <g transform="translate(100, 500)">
    <rect x="0" y="-30" width="700" height="50" fill="#d4edda" stroke="#155724" stroke-width="2" rx="8"/>
    <text x="350" y="-10" text-anchor="middle" font-size="12" font-weight="bold" fill="#155724">Isaac ROS Integration: Hardware Accelerated Perception Feeds Obstacle Detection</text>
  </g>

  <!-- Arrows showing data flow -->
  <g stroke="#6c757d" stroke-width="2">
    <!-- From environment to Nav2 components -->
    <line x1="450" y1="250" x2="500" y2="120" marker-end="url(#arrowhead)"/>

    <!-- Between Nav2 components -->
    <line x1="200" y1="90" x2="200" y2="110" marker-end="url(#arrowhead)"/>
    <line x1="200" y1="150" x2="200" y2="170" marker-end="url(#arrowhead)"/>
    <line x1="200" y1="210" x2="200" y2="230" marker-end="url(#arrowhead)"/>
    <line x1="200" y1="270" x2="200" y2="290" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Legend -->
  <g transform="translate(500, 500)">
    <rect x="0" y="0" width="15" height="15" fill="#0d6efd"/>
    <text x="20" y="12" font-size="12" fill="#212529">Start Position</text>

    <rect x="0" y="25" width="15" height="15" fill="#28a745"/>
    <text x="20" y="37" font-size="12" fill="#212529">Goal Position</text>

    <rect x="0" y="50" width="15" height="15" fill="#6c757d"/>
    <text x="20" y="62" font-size="12" fill="#212529">Obstacles</text>

    <rect x="0" y="75" width="15" height="15" fill="#6f42c1"/>
    <text x="20" y="87" font-size="12" fill="#212529">Planned Path</text>

    <rect x="0" y="100" width="15" height="15" fill="#dc3545"/>
    <text x="20" y="112" font-size="12" fill="#212529">Actual Path</text>
  </g>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d"/>
    </marker>
  </defs>
</svg>