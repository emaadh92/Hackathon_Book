<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#212529">Robot Mapping Process</text>

  <!-- Environment Scene -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="400" height="400" fill="#e9f7ef" stroke="#20c997" stroke-width="2"/>
    <text x="200" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#20c997">Environment</text>

    <!-- Room structure -->
    <rect x="50" y="50" width="300" height="300" fill="#dee2e6" stroke="#adb5bd" stroke-width="2"/>

    <!-- Walls -->
    <rect x="50" y="50" width="300" height="20" fill="#6c757d"/>
    <rect x="50" y="330" width="300" height="20" fill="#6c757d"/>
    <rect x="50" y="50" width="20" height="300" fill="#6c757d"/>
    <rect x="330" y="50" width="20" height="300" fill="#6c757d"/>

    <!-- Internal walls/obstacles -->
    <rect x="100" y="150" width="200" height="20" fill="#6c757d"/>
    <rect x="200" y="200" width="20" height="100" fill="#6c757d"/>
    <rect x="120" y="250" width="60" height="60" fill="#6c757d"/>

    <!-- Furniture -->
    <rect x="250" y="100" width="40" height="60" fill="#fd7e14" stroke="#e96b02" stroke-width="1"/>
    <circle cx="270" cy="80" r="15" fill="#6f42c1" stroke="#5a32a3" stroke-width="1"/>

    <!-- Robot starting position -->
    <circle cx="150" cy="150" r="12" fill="#0d6efd" stroke="#0b5a9d" stroke-width="2"/>
    <line x1="150" y1="150" x2="160" y2="140" stroke="#0d6efd" stroke-width="2"/>
    <text x="150" y="170" text-anchor="middle" font-size="10" fill="#495057">Start</text>

    <!-- Robot path -->
    <path d="M150,150 C180,130 210,120 240,130 C270,140 300,160 310,190 C320,220 310,250 290,270 C270,290 240,300 210,290 C180,280 160,260 150,230 C140,200 140,170 150,150"
          fill="none" stroke="#ffc107" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="230" y="110" text-anchor="middle" font-size="10" fill="#856404">Path</text>

    <!-- Robot current position -->
    <circle cx="230" cy="130" r="12" fill="#dc3545" stroke="#c82333" stroke-width="2"/>
    <line x1="230" y1="130" x2="240" y2="120" stroke="#dc3545" stroke-width="2"/>
    <text x="230" y="150" text-anchor="middle" font-size="10" fill="#721c24">Current</text>

    <!-- Sensing range -->
    <circle cx="230" cy="130" r="80" fill="none" stroke="#20c997" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="320" y="100" text-anchor="start" font-size="10" fill="#20c997">Sensing Range</text>
  </g>

  <!-- Mapping Process -->
  <g transform="translate(500, 80)">
    <rect x="0" y="0" width="400" height="400" fill="#fff" stroke="#0d6efd" stroke-width="2"/>
    <text x="200" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d6efd">Occupancy Grid Map</text>

    <!-- Grid representation -->
    <g transform="translate(50, 50)">
      <!-- Grid lines -->
      <g stroke="#dee2e6" stroke-width="1">
        <!-- Vertical lines -->
        <line x1="0" y1="0" x2="0" y2="300"/>
        <line x1="20" y1="0" x2="20" y2="300"/>
        <line x1="40" y1="0" x2="40" y2="300"/>
        <line x1="60" y1="0" x2="60" y2="300"/>
        <line x1="80" y1="0" x2="80" y2="300"/>
        <line x1="100" y1="0" x2="100" y2="300"/>
        <line x1="120" y1="0" x2="120" y2="300"/>
        <line x1="140" y1="0" x2="140" y2="300"/>
        <line x1="160" y1="0" x2="160" y2="300"/>
        <line x1="180" y1="0" x2="180" y2="300"/>
        <line x1="200" y1="0" x2="200" y2="300"/>
        <line x1="220" y1="0" x2="220" y2="300"/>
        <line x1="240" y1="0" x2="240" y2="300"/>
        <line x1="260" y1="0" x2="260" y2="300"/>
        <line x1="280" y1="0" x2="280" y2="300"/>
        <line x1="300" y1="0" x2="300" y2="300"/>

        <!-- Horizontal lines -->
        <line x1="0" y1="0" x2="300" y2="0"/>
        <line x1="0" y1="20" x2="300" y2="20"/>
        <line x1="0" y1="40" x2="300" y2="40"/>
        <line x1="0" y1="60" x2="300" y2="60"/>
        <line x1="0" y1="80" x2="300" y2="80"/>
        <line x1="0" y1="100" x2="300" y2="100"/>
        <line x1="0" y1="120" x2="300" y2="120"/>
        <line x1="0" y1="140" x2="300" y2="140"/>
        <line x1="0" y1="160" x2="300" y2="160"/>
        <line x1="0" y1="180" x2="300" y2="180"/>
        <line x1="0" y1="200" x2="300" y2="200"/>
        <line x1="0" y1="220" x2="300" y2="220"/>
        <line x1="0" y1="240" x2="300" y2="240"/>
        <line x1="0" y1="260" x2="300" y2="260"/>
        <line x1="0" y1="280" x2="300" y2="280"/>
        <line x1="0" y1="300" x2="300" y2="300"/>
      </g>

      <!-- Occupied cells (walls and obstacles) -->
      <!-- Outer walls -->
      <rect x="0" y="0" width="20" height="300" fill="#6c757d"/>
      <rect x="280" y="0" width="20" height="300" fill="#6c757d"/>
      <rect x="0" y="0" width="300" height="20" fill="#6c757d"/>
      <rect x="0" y="280" width="300" height="20" fill="#6c757d"/>

      <!-- Inner walls -->
      <rect x="40" y="100" width="200" height="20" fill="#6c757d"/>
      <rect x="140" y="140" width="20" height="100" fill="#6c757d"/>
      <rect x="60" y="190" width="40" height="40" fill="#6c757d"/>

      <!-- Furniture -->
      <rect x="190" y="40" width="20" height="40" fill="#fd7e14"/>
      <rect x="130" y="20" width="10" height="10" fill="#6f42c1"/>

      <!-- Robot path trace -->
      <circle cx="100" cy="100" r="3" fill="#ffc107"/>
      <circle cx="120" cy="90" r="3" fill="#ffc107"/>
      <circle cx="140" cy="80" r="3" fill="#ffc107"/>
      <circle cx="160" cy="80" r="3" fill="#ffc107"/>
      <circle cx="180" cy="90" r="3" fill="#ffc107"/>
      <circle cx="200" cy="110" r="3" fill="#ffc107"/>
      <circle cx="210" cy="140" r="3" fill="#ffc107"/>
      <circle cx="210" cy="170" r="3" fill="#ffc107"/>
      <circle cx="200" cy="200" r="3" fill="#ffc107"/>
      <circle cx="180" cy="220" r="3" fill="#ffc107"/>
      <circle cx="150" cy="230" r="3" fill="#ffc107"/>
      <circle cx="120" cy="220" r="3" fill="#ffc107"/>
      <circle cx="100" cy="200" r="3" fill="#ffc107"/>
      <circle cx="90" cy="170" r="3" fill="#ffc107"/>

      <!-- Current robot position on map -->
      <circle cx="140" cy="80" r="5" fill="#dc3545" stroke="#c82333" stroke-width="1"/>
    </g>
  </g>

  <!-- Process Stages -->
  <g transform="translate(50, 520)">
    <!-- Stage 1: Sensing -->
    <rect x="0" y="0" width="280" height="70" fill="#d1ecf1" stroke="#0c5460" stroke-width="2" rx="10"/>
    <text x="140" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c5460">Stage 1: Sensing</text>
    <text x="140" y="40" text-anchor="middle" font-size="12" fill="#0c5460">Robot uses sensors to detect environment</text>
    <text x="140" y="58" text-anchor="middle" font-size="11" fill="#0c5460">(LiDAR, cameras, sonar, etc.)</text>
  </g>

  <g transform="translate(350, 520)">
    <!-- Stage 2: Processing -->
    <rect x="0" y="0" width="280" height="70" fill="#f8d7da" stroke="#721c24" stroke-width="2" rx="10"/>
    <text x="140" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#721c24">Stage 2: Processing</text>
    <text x="140" y="40" text-anchor="middle" font-size="12" fill="#721c24">Algorithms interpret sensor data</text>
    <text x="140" y="58" text-anchor="middle" font-size="11" fill="#721c24">(SLAM, feature extraction, etc.)</text>
  </g>

  <g transform="translate(670, 520)">
    <!-- Stage 3: Mapping -->
    <rect x="0" y="0" width="280" height="70" fill="#d4edda" stroke="#155724" stroke-width="2" rx="10"/>
    <text x="140" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#155724">Stage 3: Mapping</text>
    <text x="140" y="40" text-anchor="middle" font-size="12" fill="#155724">Environment model is built and updated</text>
    <text x="140" y="58" text-anchor="middle" font-size="11" fill="#155724">(Occupancy grids, feature maps, etc.)</text>
  </g>

  <!-- Arrows between stages -->
  <line x1="290" y1="555" x2="340" y2="555" stroke="#6c757d" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="640" y1="555" x2="660" y2="555" stroke="#6c757d" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Isaac ROS Acceleration -->
  <g transform="translate(300, 620)">
    <rect x="0" y="0" width="350" height="60" fill="#e2e3e5" stroke="#41464b" stroke-width="2" rx="8"/>
    <text x="175" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#41464b">Isaac ROS Acceleration</text>
    <text x="175" y="42" text-anchor="middle" font-size="12" fill="#41464b">Hardware acceleration enables real-time mapping and localization</text>
  </g>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d"/>
    </marker>
  </defs>
</svg>