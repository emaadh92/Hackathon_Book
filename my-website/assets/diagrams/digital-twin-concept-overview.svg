<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>

  <!-- Real Robot Section -->
  <rect x="50" y="50" width="300" height="200" fill="#e9ecef" stroke="#adb5bd" stroke-width="2" rx="10"/>
  <text x="200" y="80" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Real Robot</text>

  <!-- Robot representation -->
  <rect x="150" y="120" width="100" height="80" fill="#007bff" stroke="#0056b3" stroke-width="2" rx="5"/>
  <circle cx="170" cy="140" r="8" fill="#fff"/>
  <circle cx="230" cy="140" r="8" fill="#fff"/>
  <rect x="160" y="200" width="20" height="30" fill="#6c757d"/>
  <rect x="220" y="200" width="20" height="30" fill="#6c757d"/>

  <!-- Arrow to digital twin -->
  <line x1="350" y1="150" x2="450" y2="150" stroke="#28a745" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Digital Twin Section -->
  <rect x="450" y="50" width="300" height="200" fill="#e8f4fd" stroke="#28a745" stroke-width="2" rx="10"/>
  <text x="600" y="80" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Digital Twin</text>

  <!-- Digital robot representation -->
  <rect x="550" y="120" width="100" height="80" fill="#28a745" stroke="#1e7e34" stroke-width="2" rx="5"/>
  <circle cx="570" cy="140" r="8" fill="#fff"/>
  <circle cx="630" cy="140" r="8" fill="#fff"/>
  <rect x="560" y="200" width="20" height="30" fill="#6c757d"/>
  <rect x="620" y="200" width="20" height="30" fill="#6c757d"/>

  <!-- Simulation Environment -->
  <rect x="450" y="300" width="300" height="250" fill="#f8f9fa" stroke="#dc3545" stroke-width="2" rx="10"/>
  <text x="600" y="330" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Simulation Environment</text>

  <!-- Virtual obstacles -->
  <rect x="480" y="360" width="60" height="40" fill="#ffc107" stroke="#e0a800" stroke-width="1"/>
  <rect x="660" y="420" width="80" height="60" fill="#ffc107" stroke="#e0a800" stroke-width="1"/>
  <circle cx="600" cy="450" r="25" fill="#ffc107" stroke="#e0a800" stroke-width="1"/>

  <!-- Legend -->
  <rect x="50" y="300" width="300" height="250" fill="#ffffff" stroke="#6c757d" stroke-width="1" rx="5"/>
  <text x="200" y="325" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">How Digital Twins Work</text>
  <text x="70" y="355" font-family="Arial" font-size="12">• Virtual replica of physical robot</text>
  <text x="70" y="375" font-family="Arial" font-size="12">• Mimics real-world physics</text>
  <text x="70" y="395" font-family="Arial" font-size="12">• Safe testing environment</text>
  <text x="70" y="415" font-family="Arial" font-size="12">• Accelerates learning</text>
  <text x="70" y="435" font-family="Arial" font-size="12">• Risk-free experimentation</text>

  <!-- Arrow definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
</svg>