<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" role="img" aria-label="Software-to-Hardware Component Mapping: Diagram showing how robot functions connect to physical components">
  <title>Software-to-Hardware Component Mapping</title>
  <desc>This diagram shows the mapping between robot software functions (departments) and their corresponding physical hardware components. The upper section displays robot functions like Vision Department, Motor Control, Decision Making, Safety Monitor, and Localization. The middle section shows physical components like cameras, motors, main computer, safety sensors, and positioning systems. The lower section illustrates how these connect inside a physical robot chassis with wheels, cameras, and internal components. Dashed and solid arrows indicate direct and indirect functional connections.</desc>

  <style>
    .software { fill: #2E86AB; stroke: #1A5A7F; stroke-width: 2; rx: 8; ry: 8; }
    .hardware { fill: #F18F01; stroke: #B86B00; stroke-width: 2; rx: 8; ry: 8; }
    .connection { stroke: #333; stroke-width: 2; stroke-dasharray: 5,5; marker-end: url(#arrowhead); }
    .text { fill: white; font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; dominant-baseline: middle; }
    .hw-text { fill: white; font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; dominant-baseline: middle; }
    .label { fill: #333; font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
    .title { fill: #333; font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" class="title">Software-to-Hardware Component Mapping</text>
  <text x="600" y="65" class="label">Connecting Robot Functions to Physical Components</text>

  <!-- Software Layer (Robot Functions) -->
  <text x="300" y="120" class="label" font-weight="bold">ROBOT FUNCTIONS (SOFTWARE)</text>

  <!-- Vision Department -->
  <rect x="100" y="140" width="180" height="70" class="software"/>
  <text x="190" y="165" class="text" font-size="13">Vision Department</text>
  <text x="190" y="185" class="text" font-size="10">(Image Processing)</text>

  <!-- Motor Control -->
  <rect x="320" y="140" width="180" height="70" class="software"/>
  <text x="410" y="165" class="text" font-size="13">Motor Control</text>
  <text x="410" y="185" class="text" font-size="10">(Motion Control)</text>

  <!-- Decision Making -->
  <rect x="540" y="140" width="180" height="70" class="software"/>
  <text x="630" y="165" class="text" font-size="13">Decision Making</text>
  <text x="630" y="185" class="text" font-size="10">(Behavior Control)</text>

  <!-- Safety Monitor -->
  <rect x="760" y="140" width="180" height="70" class="software"/>
  <text x="850" y="165" class="text" font-size="13">Safety Monitor</text>
  <text x="850" y="185" class="text" font-size="10">(Risk Assessment)</text>

  <!-- Localization -->
  <rect x="1000" y="140" width="180" height="70" class="software"/>
  <text x="1090" y="165" class="text" font-size="13">Localization</text>
  <text x="1090" y="185" class="text" font-size="10">(Positioning)</text>

  <!-- Hardware Layer (Physical Components) -->
  <text x="300" y="300" class="label" font-weight="bold">PHYSICAL COMPONENTS (HARDWARE)</text>

  <!-- Cameras -->
  <rect x="100" y="320" width="180" height="70" class="hardware"/>
  <text x="190" y="345" class="hw-text" font-size="13">Cameras & Sensors</text>
  <text x="190" y="365" class="hw-text" font-size="10">(RGB, Depth, IR)</text>

  <!-- Motors -->
  <rect x="320" y="320" width="180" height="70" class="hardware"/>
  <text x="410" y="345" class="hw-text" font-size="13">Drive Motors</text>
  <text x="410" y="365" class="hw-text" font-size="10">(Wheels, Tracks, Legs)</text>

  <!-- Main Computer -->
  <rect x="540" y="320" width="180" height="70" class="hardware"/>
  <text x="630" y="345" class="hw-text" font-size="13">Main Computer</text>
  <text x="630" y="365" class="hw-text" font-size="10">(CPU, GPU, RAM)</text>

  <!-- Safety Sensors -->
  <rect x="760" y="320" width="180" height="70" class="hardware"/>
  <text x="850" y="345" class="hw-text" font-size="13">Safety Sensors</text>
  <text x="850" y="365" class="hw-text" font-size="10">(Bumpers, Lasers)</text>

  <!-- IMU/GPS -->
  <rect x="1000" y="320" width="180" height="70" class="hardware"/>
  <text x="1090" y="345" class="hw-text" font-size="13">IMU/GPS</text>
  <text x="1090" y="365" class="hw-text" font-size="10">(Inertial, Position)</text>

  <!-- Connection Arrows -->
  <!-- Vision to Cameras -->
  <line x1="190" y1="210" x2="190" y2="320" class="connection"/>
  <text x="150" y="265" class="label" font-size="10">Processes</text>
  <text x="150" y="280" class="label" font-size="10">Images</text>

  <!-- Motor Control to Motors -->
  <line x1="410" y1="210" x2="410" y2="320" class="connection"/>
  <text x="370" y="265" class="label" font-size="10">Controls</text>
  <text x="370" y="280" class="label" font-size="10">Motion</text>

  <!-- Decision Making to Computer -->
  <line x1="630" y1="210" x2="630" y2="320" class="connection"/>
  <text x="590" y="265" class="label" font-size="10">Runs</text>
  <text x="590" y="280" class="label" font-size="10">Algorithms</text>

  <!-- Safety to Sensors -->
  <line x1="850" y1="210" x2="850" y2="320" class="connection"/>
  <text x="810" y="265" class="label" font-size="10">Monitors</text>
  <text x="810" y="280" class="label" font-size="10">Hazards</text>

  <!-- Localization to IMU/GPS -->
  <line x1="1090" y1="210" x2="1090" y2="320" class="connection"/>
  <text x="1050" y="265" class="label" font-size="10">Determines</text>
  <text x="1050" y="280" class="label" font-size="10">Position</text>

  <!-- Additional Hardware Components -->
  <text x="300" y="450" class="label" font-weight="bold">ADDITIONAL PHYSICAL COMPONENTS</text>

  <!-- Gripper/Manipulator -->
  <rect x="100" y="470" width="180" height="70" class="hardware"/>
  <text x="190" y="495" class="hw-text" font-size="13">Gripper/Arm</text>
  <text x="190" y="515" class="hw-text" font-size="10">(Manipulation)</text>

  <!-- Battery -->
  <rect x="320" y="470" width="180" height="70" class="hardware"/>
  <text x="410" y="495" class="hw-text" font-size="13">Battery & Power</text>
  <text x="410" y="515" class="hw-text" font-size="10">(Management)</text>

  <!-- Communication Module -->
  <rect x="540" y="470" width="180" height="70" class="hardware"/>
  <text x="630" y="495" class="hw-text" font-size="13">Comm Module</text>
  <text x="630" y="515" class="hw-text" font-size="10">(WiFi, Bluetooth)</text>

  <!-- Audio System -->
  <rect x="760" y="470" width="180" height="70" class="hardware"/>
  <text x="850" y="495" class="hw-text" font-size="13">Audio System</text>
  <text x="850" y="515" class="hw-text" font-size="10">(Speaker, Mic)</text>

  <!-- Display -->
  <rect x="1000" y="470" width="180" height="70" class="hardware"/>
  <text x="1090" y="495" class="hw-text" font-size="13">Display</text>
  <text x="1090" y="515" class="hw-text" font-size="10">(Touchscreen)</text>

  <!-- More connection arrows -->
  <line x1="190" y1="210" x2="190" y2="470" class="connection" stroke-dasharray="3,3"/>
  <line x1="410" y1="210" x2="410" y2="470" class="connection" stroke-dasharray="3,3"/>
  <line x1="630" y1="210" x2="630" y2="470" class="connection" stroke-dasharray="3,3"/>
  <line x1="850" y1="210" x2="850" y2="470" class="connection" stroke-dasharray="3,3"/>
  <line x1="1090" y1="210" x2="1090" y2="470" class="connection" stroke-dasharray="3,3"/>

  <!-- Robot Physical Structure -->
  <text x="600" y="600" class="label" font-weight="bold">ROBOT PHYSICAL STRUCTURE</text>

  <!-- Robot Base -->
  <rect x="400" y="620" width="400" height="200" fill="#D3D3D3" stroke="#A9A9A9" stroke-width="2" rx="20" ry="20"/>
  <text x="600" y="650" class="label" font-weight="bold">Robot Chassis</text>

  <!-- Wheels -->
  <circle cx="450" cy="780" r="25" fill="#696969" stroke="#000" stroke-width="2"/>
  <circle cx="750" cy="780" r="25" fill="#696969" stroke="#000" stroke-width="2"/>
  <text x="450" y="810" class="label" font-size="10">Wheel</text>
  <text x="750" y="810" class="label" font-size="10">Wheel</text>

  <!-- Camera Mount -->
  <rect x="580" y="620" width="40" height="40" fill="#A9A9A9" stroke="#000" stroke-width="1"/>
  <text x="600" y="645" class="label" font-size="9">Camera</text>

  <!-- Top Cover -->
  <rect x="420" y="600" width="360" height="20" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="1"/>
  <text x="600" y="615" class="label" font-size="10">Top Panel</text>

  <!-- Component Placement Labels -->
  <text x="400" y="850" class="label" font-weight="bold">COMPONENT PLACEMENT INSIDE ROBOT</text>

  <!-- Internal components -->
  <rect x="420" y="680" width="100" height="50" fill="#F5F5DC" stroke="#D2B48C" stroke-width="1"/>
  <text x="470" y="700" class="label" font-size="9">Main</text>
  <text x="470" y="715" class="label" font-size="9">Computer</text>

  <rect x="540" y="680" width="100" height="50" fill="#F5F5DC" stroke="#D2B48C" stroke-width="1"/>
  <text x="590" y="700" class="label" font-size="9">Motor</text>
  <text x="590" y="715" class="label" font-size="9">Controllers</text>

  <rect x="660" y="680" width="100" height="50" fill="#F5F5DC" stroke="#D2B48C" stroke-width="1"/>
  <text x="710" y="700" class="label" font-size="9">Power</text>
  <text x="710" y="715" class="label" font-size="9">System</text>

  <rect x="480" y="750" width="300" height="20" fill="#FFE4C4" stroke="#D2B48C" stroke-width="1"/>
  <text x="630" y="765" class="label" font-size="9">Battery Pack</text>

  <!-- Legend -->
  <rect x="50" y="900" width="20" height="20" class="software"/>
  <text x="80" y="915" class="label">Software Function (Robot Department)</text>

  <rect x="300" y="900" width="20" height="20" class="hardware"/>
  <text x="330" y="915" class="label">Physical Component (Hardware)</text>

  <line x1="550" y1="910" x2="580" y2="910" class="connection"/>
  <text x="600" y="915" class="label">Functional Connection</text>

  <line x1="750" y1="910" x2="780" y2="910" class="connection" stroke-dasharray="3,3"/>
  <text x="800" y="915" class="label">Indirect Connection</text>
</svg>