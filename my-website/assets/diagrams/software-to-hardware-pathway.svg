<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800">
  <style>
    .layer { fill: none; stroke: #ccc; stroke-width: 2; stroke-dasharray: 5,5; }
    .layer-label { fill: #666; font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; }
    .software { fill: #2E86AB; stroke: #1A5A7F; stroke-width: 2; rx: 8; ry: 8; }
    .middleware { fill: #A23B72; stroke: #7A2A56; stroke-width: 2; rx: 8; ry: 8; }
    .hardware { fill: #F18F01; stroke: #B86B00; stroke-width: 2; rx: 8; ry: 8; }
    .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
    .arrow-label { fill: #333; font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
    .text { fill: white; font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; dominant-baseline: middle; }
    .hw-text { fill: white; font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; dominant-baseline: middle; }
    .legend-text { fill: #333; font-family: Arial, sans-serif; font-size: 12px; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="40" class="legend-text" font-size="20" text-anchor="middle" font-weight="bold">Software-to-Hardware Pathway</text>
  <text x="500" y="65" class="legend-text" text-anchor="middle">From Digital Decisions to Physical Actions</text>

  <!-- Layers -->
  <rect x="50" y="100" width="900" height="150" class="layer"/>
  <text x="500" y="120" class="layer-label">SOFTWARE LAYER</text>

  <rect x="50" y="300" width="900" height="150" class="layer"/>
  <text x="500" y="320" class="layer-label">MIDDLEWARE/CONTROLLER LAYER</text>

  <rect x="50" y="500" width="900" height="200" class="layer"/>
  <text x="500" y="520" class="layer-label">HARDWARE LAYER</text>

  <!-- Software Layer Components -->
  <rect x="100" y="130" width="150" height="60" class="software"/>
  <text x="175" y="160" class="text" font-size="11">High-Level</text>
  <text x="175" y="175" class="text" font-size="11">Planning</text>

  <rect x="300" y="130" width="150" height="60" class="software"/>
  <text x="375" y="160" class="text" font-size="11">Behavior</text>
  <text x="375" y="175" class="text" font-size="11">Controller</text>

  <rect x="500" y="130" width="150" height="60" class="software"/>
  <text x="575" y="160" class="text" font-size="11">Motion</text>
  <text x="575" y="175" class="text" font-size="11">Planner</text>

  <rect x="700" y="130" width="150" height="60" class="software"/>
  <text x="775" y="160" class="text" font-size="11">Task</text>
  <text x="775" y="175" class="text" font-size="11">Scheduler</text>

  <!-- Middleware Layer Components -->
  <rect x="200" y="330" width="200" height="60" class="middleware"/>
  <text x="300" y="360" class="text" font-size="11">Navigation</text>
  <text x="300" y="375" class="text" font-size="11">Stack</text>

  <rect x="500" y="330" width="200" height="60" class="middleware"/>
  <text x="600" y="360" class="text" font-size="11">Motor</text>
  <text x="600" y="375" class="text" font-size="11">Controller</text>

  <!-- Hardware Layer Components -->
  <rect x="150" y="530" width="150" height="60" class="hardware"/>
  <text x="225" y="560" class="hw-text" font-size="11">Computer</text>
  <text x="225" y="575" class="hw-text" font-size="11">Board</text>

  <rect x="350" y="530" width="150" height="60" class="hardware"/>
  <text x="425" y="560" class="hw-text" font-size="11">Motor</text>
  <text x="425" y="575" class="hw-text" font-size="11">Drivers</text>

  <rect x="550" y="530" width="150" height="60" class="hardware"/>
  <text x="625" y="560" class="hw-text" font-size="11">Actuators</text>
  <text x="625" y="575" class="hw-text" font-size="11">& Motors</text>

  <rect x="750" y="530" width="150" height="60" class="hardware"/>
  <text x="825" y="560" class="hw-text" font-size="11">Sensors</text>
  <text x="825" y="575" class="hw-text" font-size="11">& Encoders</text>

  <!-- Physical Output -->
  <rect x="400" y="650" width="200" height="60" class="hardware"/>
  <text x="500" y="680" class="hw-text" font-size="12">Physical</text>
  <text x="500" y="695" class="hw-text" font-size="12">Robot Action</text>

  <!-- Arrows showing the pathway -->
  <!-- Software to Middleware -->
  <line x1="175" y1="190" x2="300" y2="330" class="arrow"/>
  <text x="200" y="260" class="arrow-label" font-size="10">Path Request</text>

  <line x1="375" y1="190" x2="300" y2="330" class="arrow"/>
  <text x="320" y="260" class="arrow-label" font-size="10">Behavior Commands</text>

  <line x1="575" y1="190" x2="600" y2="330" class="arrow"/>
  <text x="580" y="260" class="arrow-label" font-size="10">Velocity Commands</text>

  <!-- Middleware to Hardware -->
  <line x1="300" y1="390" x2="225" y2="530" class="arrow"/>
  <text x="240" y="460" class="arrow-label" font-size="10">Control Signals</text>

  <line x1="600" y1="390" x2="425" y2="530" class="arrow"/>
  <text x="480" y="460" class="arrow-label" font-size="10">Motor Commands</text>

  <!-- Hardware to Physical Action -->
  <line x1="425" y1="590" x2="500" y2="650" class="arrow"/>
  <text x="450" y="620" class="arrow-label" font-size="10">Physical Movement</text>

  <line x1="625" y1="590" x2="500" y2="650" class="arrow"/>
  <text x="570" y="620" class="arrow-label" font-size="10">Robot Motion</text>

  <!-- Feedback Arrows -->
  <line x1="500" y1="650" x2="725" y2="590" class="arrow" stroke-dasharray="5,5"/>
  <text x="630" y="620" class="arrow-label" font-size="10">Feedback: Position, Speed</text>

  <line x1="725" y1="530" x2="600" y2="390" class="arrow" stroke-dasharray="5,5"/>
  <text x="640" y="460" class="arrow-label" font-size="10">Sensor Data</text>

  <line x1="300" y1="330" x2="775" y2="190" class="arrow" stroke-dasharray="5,5"/>
  <text x="480" y="260" class="arrow-label" font-size="10">Status Updates</text>

  <!-- Legend -->
  <rect x="50" y="730" width="20" height="20" class="software"/>
  <text x="80" y="745" class="legend-text">Software Layer</text>

  <rect x="200" y="730" width="20" height="20" class="middleware"/>
  <text x="230" y="745" class="legend-text">Middleware/Controller</text>

  <rect x="380" y="730" width="20" height="20" class="hardware"/>
  <text x="410" y="745" class="legend-text">Hardware Layer</text>

  <line x1="550" y1="740" x2="580" y2="740" class="arrow"/>
  <text x="590" y="745" class="legend-text">Forward Path</text>

  <line x1="700" y1="740" x2="730" y2="740" class="arrow" stroke-dasharray="5,5"/>
  <text x="740" y="745" class="legend-text">Feedback Path</text>

  <!-- Labels -->
  <text x="100" y="200" class="legend-text" font-size="10">High-level</text>
  <text x="100" y="215" class="legend-text" font-size="10">decisions</text>

  <text x="650" y="200" class="legend-text" font-size="10">Specific</text>
  <text x="650" y="215" class="legend-text" font-size="10">commands</text>

  <text x="100" y="400" class="legend-text" font-size="10">Translation</text>
  <text x="100" y="415" class="legend-text" font-size="10">& Control</text>

  <text x="750" y="400" class="legend-text" font-size="10">Low-level</text>
  <text x="750" y="415" class="legend-text" font-size="10">control</text>

  <text x="100" y="600" class="legend-text" font-size="10">Physical</text>
  <text x="100" y="615" class="legend-text" font-size="10">components</text>

  <text x="750" y="600" class="legend-text" font-size="10">Sensors &</text>
  <text x="750" y="615" class="legend-text" font-size="10">Feedback</text>
</svg>